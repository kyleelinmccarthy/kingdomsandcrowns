<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#e2b54a"/>
      <stop offset="1" stop-color="#9a6a1c"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9953a"/>
      <stop offset="1" stop-color="#7a5217"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1408" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- index finger, pointing straight up: the hotspot is its tip -->
    <rect x="9.5" y="2" width="5" height="14" rx="2.3" fill="url(#gold)"/>
    <!-- back of the hand and the three curled fingers, a rounded mass right of the index root -->
    <path d="M13.2 13 Q9 13 9 17 L9 20 Q9 24 13 24 L22 24 Q26 24 26 20 L26 17 Q26 13 21.8 13 Z" fill="url(#gold)"/>
    <!-- the thumb: sticks out to the LEFT at mid-height, the mark that reads this as pointing -->
    <path d="M9.3 16.4 Q4.4 14.6 2.6 18 Q1.4 20.8 4.4 22.6 Q7.4 24.1 9.8 21.1 Z" fill="url(#gold)"/>
    <!-- cuff -->
    <path d="M9 24 L26 24 L28 30.4 L7 30.4 Z" fill="url(#cuff)"/>
  </g>
  <!-- knuckle creases on the three curled fingers -->
  <path d="M15.5 13.6 V18 M19 13.4 V18.2 M22.5 13.6 V18" stroke="#7a5217" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- thumbnail crease -->
  <path d="M5 17.4 Q4 19 5.4 20.6" fill="none" stroke="#7a5217" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- shine on the index finger -->
  <path d="M10.6 4 V13" stroke="#fffbe6" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
