name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # A local libsql file stands in for Turso (Turso is libsql). The real-database tests make
    # their own temporary databases.
    env:
      TURSO_DATABASE_URL: "file:./ci.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Migrations apply cleanly
        run: npm run db:migrate

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
