# Local Postgres 18 for development and the real-database tests.
#   docker compose up -d
# Something else already on 5432? POSTGRES_PORT=5433 docker compose up -d, and point
# DATABASE_URL at that port.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kingdomsandcrowns
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in a versioned directory under /var/lib/postgresql,
      # so the volume mounts there (not at .../data, as in 17 and earlier).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kingdomsandcrowns"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
